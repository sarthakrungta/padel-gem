name: Test Playtomic fetch
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests
      - run: |
          python -c "import requests; print('IP:', requests.get('https://api.ipify.org', timeout=10).text); u='https://playtomic.com/api/clubs/availability?tenant_id=b5a636e5-35d0-421b-b823-d857b8c9f088&date=2026-10-08&sport_id=PADEL'; r=requests.get(u,timeout=20); print('status:', r.status_code)"